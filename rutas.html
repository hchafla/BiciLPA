<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiciLPA · Rutas</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-light: #f8f9fa;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e2e8f0;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            height: 100%;
            width: 100%;
            position: fixed;
            inset: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-light);
        }
        body {
            display: flex;
            flex-direction: column;
        }
        /* Navegación superior */
        nav {
            background: #2c3e50;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 2000;
        }
        nav a { color: #bdc3c7; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 0.95rem; }
        nav a:hover, nav a.active { color: #fff; border-bottom: 2px solid #2ecc71; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #fff; text-decoration: none; }
        
        .map-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
        }
        #map-rutas {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* HEADER / SELECTOR DE EJES (Flotante) */
        .selector-ejes {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 90%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .selector-ejes::-webkit-scrollbar {
            display: none;
        }
        .eje-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-dark);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .eje-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        .eje-btn.active {
            color: #fff;
        }
        .eje-btn[data-eje="este"].active { background-color: #0074D9; }
        .eje-btn[data-eje="norte"].active { background-color: #2ECC40; }
        .eje-btn[data-eje="baja-alta"].active { background-color: #FF851B; }
        .eje-btn[data-eje="alta-baja"].active { background-color: #B10DC9; }

        /* CARRUSEL HORIZONTAL DE RUTAS */
        .rutas-carrusel {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: none;
            gap: 10px;
            max-width: 90%;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }
        .rutas-carrusel::-webkit-scrollbar {
            display: none;
        }
        .carrusel-item {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow);
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .carrusel-item:hover {
            transform: translateY(-2px);
        }
        .carrusel-item.active[data-eje-grupo="este"] { background: #0074D9; color: white; border-color: #0074D9; }
        .carrusel-item.active[data-eje-grupo="norte"] { background: #2ECC40; color: white; border-color: #2ECC40; }
        .carrusel-item.active[data-eje-grupo="baja-alta"] { background: #FF851B; color: white; border-color: #FF851B; }
        .carrusel-item.active[data-eje-grupo="alta-baja"] { background: #B10DC9; color: white; border-color: #B10DC9; }

        /* BARRA LATERAL (SIDEBAR / BOTTOM SHEET) */
        .rutas-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 380px;
            max-height: calc(100vh - 40px);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: var(--shadow);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            border: 1px solid var(--border-color);
        }
        .rutas-sidebar.visible {
            transform: translateX(0);
        }
        .drag-handle {
            display: none;
            width: 40px;
            height: 5px;
            background: #cbd5e1;
            border-radius: 3px;
            margin: 10px auto 5px auto;
            cursor: grab;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 15px 20px 10px 20px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            transition: var(--transition);
        }
        .close-btn:hover {
            color: var(--text-dark);
        }
        .sidebar-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .ruta-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .ruta-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            cursor: pointer;
        }
        .ruta-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: -5px;
        }
        .ruta-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        .ruta-meta span {
            background: var(--bg-light);
            padding: 6px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tag-dificultad { color: white !important; }
        .tag-dificultad.facil { background-color: #2ecc71 !important; }
        .tag-dificultad.moderado { background-color: #f39c12 !important; }
        .tag-dificultad.dificil { background-color: #e74c3c !important; }
        .descripcion-ruta {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #4a5568;
        }
        .indicaciones {
            background: #f7fafc;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #4a5568;
        }
        .ruta-card[data-eje="este"] .indicaciones { border-left-color: #0074D9; }
        .ruta-card[data-eje="norte"] .indicaciones { border-left-color: #2ECC40; }
        .ruta-card[data-eje="baja-alta"] .indicaciones { border-left-color: #FF851B; }
        .ruta-card[data-eje="alta-baja"] .indicaciones { border-left-color: #B10DC9; }

        .marcador-punto-icono-interior {
            width: 34px;
            height: 34px;
            background: #fff;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: var(--shadow);
        }

        /* BOTÓN FLOTANTE DE GEOLOCALIZACIÓN */
        .geoloc-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
        }
        .geoloc-btn:hover { background: rgba(0, 0, 0, 0.05); }
        .geoloc-btn.activo { background: var(--accent-color); border-color: var(--accent-color); }
        .geoloc-btn.buscando { animation: geolocPulso 1s ease-in-out infinite; }
        @keyframes geolocPulso {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .marcador-ubicacion-usuario-wrap { position: relative; width: 18px; height: 18px; }
        .marcador-ubicacion-usuario-dot {
            position: absolute;
            inset: 0;
            background: #4285F4;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
        }
        .marcador-ubicacion-usuario-pulso {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            background: rgba(66, 133, 244, 0.35);
            border-radius: 50%;
            animation: pulsoUbicacion 1.8s ease-out infinite;
        }
        @keyframes pulsoUbicacion {
            0% { transform: scale(1); opacity: 0.65; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* CONTROL DE CAPAS DESPLEGABLE (Idéntico a index.html) */
        .custom-layer-control {
            background: rgba(255, 255, 255, 0.95) !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow) !important;
            border: 1px solid var(--border-color) !important;
            backdrop-filter: blur(8px);
            overflow: hidden;
            transition: var(--transition);
        }

        .layer-toggle-btn {
            background: transparent;
            border: none;
            padding: 10px 14px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: var(--text-dark);
            width: 100%;
        }

        .layer-options {
            display: none;
            padding: 8px 12px 12px 12px;
            border-top: 1px solid var(--border-color);
            flex-direction: column;
            gap: 8px;
        }

        .layer-options.open {
            display: flex;
        }

        .layer-option-btn {
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dark);
            cursor: pointer;
            text-align: left;
            transition: var(--transition);
        }

        .layer-option-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .geoloc-btn {
                bottom: 20px;
                right: 16px;
                width: 46px;
                height: 46px;
                font-size: 1.25rem;
            }

            /* Ajuste de posición justo debajo del menú superior en móvil */
            .leaflet-top.leaflet-right {
                top: 85px !important;
                right: 10px !important;
            }

            .selector-ejes {
                top: 10px;
                padding: 6px;
                position: relative;
            }
            .eje-btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .rutas-carrusel {
                top: 70px;
            }
            .rutas-sidebar {
                top: auto;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 85%;
                max-height: 85vh;
                border-radius: 24px 24px 0 0;
                transform: translateY(100%);
                box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.15);
                border: none;
                border-top: 1px solid var(--border-color);
            }
            .rutas-sidebar.visible {
                transform: translateY(55%);
            }
            .rutas-sidebar.expanded {
                transform: translateY(0%) !important;
            }
            .rutas-sidebar.minimized {
                transform: translateY(calc(100% - 75px)) !important;
            }
            .drag-handle {
                display: block;
            }
            .sidebar-header {
                padding: 5px 20px;
                justify-content: space-between;
                align-items: center;
                border-bottom: none;
            }
            .sidebar-content {
                padding: 10px 20px 30px 20px;
            }

            .selector-ejes::after {
                content: '›';
                position: absolute;
                top: 0;
                right: 0;
                width: 46px;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: flex-end;
                padding-right: 8px;
                font-size: 1.4rem;
                font-weight: 800;
                color: var(--accent-color);
                background: linear-gradient(to right, rgba(248,249,250,0), rgba(248,249,250,0.9) 55%, rgba(248,249,250,0.98) 80%);
                border-radius: 0 30px 30px 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
                animation: pistaScrollPulso 1.3s ease-in-out infinite;
            }
            .selector-ejes.scroll-fin::after {
                opacity: 0;
                animation: none;
            }
            @keyframes pistaScrollPulso {
                0%, 100% { transform: translateX(0); opacity: 1; }
                50% { transform: translateX(5px); opacity: 0.5; }
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">🚲 BiciLPA</a>
         <span class="nav-slogan">
                Mapa, rutas y servicios para moverte en bici por Las Palmas de Gran Canaria
            </span>
        <div>
            <a href="index.html">Mapa en Vivo</a>
            <a href="rutas.html" class="active">Rutas Recomendadas</a>
            <a href="normativa.html">Normativa</a>
            <a href="talleres.html">Talleres</a>
        </div>
    </nav>
    <div class="map-container">
        <div class="selector-ejes" id="selector-ejes">
            <button class="eje-btn" data-eje="este" onclick="filtrarEje('este')">Eje Este</button>
            <button class="eje-btn" data-eje="norte" onclick="filtrarEje('norte')">Eje Norte</button>
            <button class="eje-btn" data-eje="baja-alta" onclick="filtrarEje('baja-alta')">Conexión Baja-Alta</button>
            <button class="eje-btn" data-eje="alta-baja" onclick="filtrarEje('alta-baja')">Conexión Alta-Baja</button>
        </div>
        
        <div class="rutas-carrusel" id="rutas-carrusel"></div>
        <div id="map-rutas"></div>
        
        <button class="geoloc-btn" id="btn-geoloc" onclick="alternarGeolocalizacion()" title="Ver mi ubicación en el mapa" aria-label="Ver mi ubicación en el mapa">📍</button>
        
        <div class="rutas-sidebar" id="rutas-sidebar">
            <div class="drag-handle" id="drag-handle"></div>
            <div class="sidebar-header">
                <button class="close-btn" onclick="cerrarSidebar()">✕</button>
            </div>
            <div class="sidebar-content" id="contenedor-tarjetas"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="datos/manifest.js"></script>
    
    <script>
        // CAPAS BASE DE MAPAS
        const mapaClaro = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });

        const mapaOscuro = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });

        const mapaSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google Maps',
            maxZoom: 20
        });

        const map = L.map('map-rutas', {
            center: [28.128, -15.432],
            zoom: 13,
            layers: [mapaClaro]
        });

        // CONTROL DE CAPAS DESPLEGABLE PERSONALIZADO
        const CustomLayerControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                const container = L.DomUtil.create('div', 'custom-layer-control leaflet-bar');
                
                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                container.innerHTML = `
                    <button class="layer-toggle-btn" id="layer-toggle-btn" title="Cambiar mapa base">
                        🗺️ <span style="font-size: 0.85rem;">Capas</span>
                    </button>
                    <div class="layer-options" id="layer-options">
                        <button class="layer-option-btn active" data-layer="claro">🗺️ Mapa</button>
                        <button class="layer-option-btn" data-layer="oscuro">🌙 Oscuro</button>
                        <button class="layer-option-btn" data-layer="satelite">🛰️ Satélite</button>
                    </div>
                `;

                return container;
            }
        });

        map.addControl(new CustomLayerControl());

        // LÓGICA DE APERTURA/CIERRE DEL DESPLEGABLE
        document.addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('#layer-toggle-btn');
            const optionBtn = e.target.closest('.layer-option-btn');
            const layerOptions = document.getElementById('layer-options');

            if (toggleBtn) {
                if (layerOptions) layerOptions.classList.toggle('open');
                return;
            }

            if (optionBtn) {
                const layerType = optionBtn.getAttribute('data-layer');

                map.removeLayer(mapaClaro);
                map.removeLayer(mapaOscuro);
                map.removeLayer(mapaSatelite);

                if (layerType === 'claro') mapaClaro.addTo(map);
                if (layerType === 'oscuro') mapaOscuro.addTo(map);
                if (layerType === 'satelite') mapaSatelite.addTo(map);

                document.querySelectorAll('.layer-option-btn').forEach(btn => btn.classList.remove('active'));
                optionBtn.classList.add('active');

                if (layerOptions) layerOptions.classList.remove('open');
                return;
            }

            if (layerOptions && !e.target.closest('.custom-layer-control')) {
                layerOptions.classList.remove('open');
            }
        });

        let capasPreview = L.layerGroup().addTo(map);
        let rutasCache = {};
        let capasRutas = {};
        let ejeActual = null;
        let idRutaSeleccionada = null;

        // GEOLOCALIZACIÓN
        let siguiendoUbicacion = false;
        let esperandoPrimerFix = true;
        let marcadorUbicacion = null;
        let circuloPrecision = null;

        const iconoUbicacion = L.divIcon({
            className: 'marcador-ubicacion-usuario-wrap',
            html: '<div class="marcador-ubicacion-usuario-pulso"></div><div class="marcador-ubicacion-usuario-dot"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        function alternarGeolocalizacion() {
            if (siguiendoUbicacion) {
                detenerGeolocalizacion();
                return;
            }
            if (!navigator.geolocation) {
                alert('Tu navegador no admite geolocalización.');
                return;
            }
            siguiendoUbicacion = true;
            esperandoPrimerFix = true;
            document.getElementById('btn-geoloc').classList.add('buscando');
            map.locate({ watch: true, enableHighAccuracy: true, setView: false, maximumAge: 5000 });
        }

        function detenerGeolocalizacion() {
            siguiendoUbicacion = false;
            esperandoPrimerFix = true;
            map.stopLocate();
            const btn = document.getElementById('btn-geoloc');
            btn.classList.remove('activo', 'buscando');
            if (marcadorUbicacion) {
                map.removeLayer(marcadorUbicacion);
                marcadorUbicacion = null;
            }
            if (circuloPrecision) {
                map.removeLayer(circuloPrecision);
                circuloPrecision = null;
            }
        }

        map.on('locationfound', function (e) {
            const btn = document.getElementById('btn-geoloc');
            btn.classList.remove('buscando');
            btn.classList.add('activo');

            if (!marcadorUbicacion) {
                marcadorUbicacion = L.marker(e.latlng, {
                    icon: iconoUbicacion,
                    zIndexOffset: 1000,
                    interactive: false
                }).addTo(map);
            } else {
                marcadorUbicacion.setLatLng(e.latlng);
            }

            if (!circuloPrecision) {
                circuloPrecision = L.circle(e.latlng, {
                    radius: e.accuracy,
                    color: '#4285F4',
                    weight: 1,
                    fillColor: '#4285F4',
                    fillOpacity: 0.08,
                    interactive: false
                }).addTo(map);
            } else {
                circuloPrecision.setLatLng(e.latlng);
                circuloPrecision.setRadius(e.accuracy);
            }

            if (esperandoPrimerFix) {
                map.setView(e.latlng, Math.max(map.getZoom(), 15));
                esperandoPrimerFix = false;
            }
        });

        map.on('locationerror', function (e) {
            console.error('Error de geolocalización:', e.message);
            alert('No se ha podido acceder a tu ubicación. Comprueba que le has dado permiso al navegador y que la página se sirve por HTTPS.');
            detenerGeolocalizacion();
        });

        const coloresEjes = {
            'este': '#0074D9',   
            'norte': '#2ECC40',     
            'baja-alta': '#FF851B', 
            'alta-baja': '#B10DC9'  
        };

        window.addEventListener("load", () => {
            if (typeof rutasManifest !== 'undefined') {
                precargarTodaLaRed();
                filtrarEje('este');
            } else {
                console.error("Error crítico: 'rutasManifest' no está definido.");
            }
        });

        async function precargarTodaLaRed() {
            const todosLosIds = Object.keys(rutasManifest);
            for (const idRuta of todosLosIds) {
                try {
                    await cargarDatosRuta(idRuta);
                    if (idRutaSeleccionada !== idRuta) {
                        renderizarCapaRuta(idRuta, false);
                    }
                } catch (err) {
                    console.error(err.message);
                }
            }
        }

        function filtrarEje(ejeId) {
            document.querySelectorAll('.eje-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-eje') === ejeId);
            });

            ejeActual = ejeId;

            const carrusel = document.getElementById('rutas-carrusel');
            carrusel.innerHTML = '';
            carrusel.style.display = 'flex';

            if (typeof rutasManifest === 'undefined') {
                carrusel.style.display = 'none';
                return;
            }

            const idsDelEje = Object.keys(rutasManifest).filter(idRuta =>
                String(rutasManifest[idRuta].eje).trim().toLowerCase() === String(ejeId).trim().toLowerCase()
            );

            if (idsDelEje.length === 0) {
                carrusel.style.display = 'none';
                return;
            }

            idsDelEje.forEach(idRuta => {
                const infoSimplificada = rutasManifest[idRuta];
                const item = document.createElement('div');
                item.className = 'carrusel-item';
                item.setAttribute('data-id-ruta', idRuta);
                item.setAttribute('data-eje-grupo', ejeId);
                item.innerText = infoSimplificada.titulo;
                if (idRuta === idRutaSeleccionada) {
                    item.classList.add('active');
                }
                item.onclick = () => seleccionarRuta(idRuta);
                carrusel.appendChild(item);
            });

            requestAnimationFrame(actualizarPistaScrollCarrusel);
        }

        function cargarDatosRuta(idRuta) {
            return new Promise((resolve, reject) => {
                if (rutasCache[idRuta]) {
                    resolve(rutasCache[idRuta]);
                    return;
                }
                const script = document.createElement('script');
                script.src = `datos/rutas/${idRuta}.js`;

                script.onload = () => {
                    if (window.rutaActivaDatos && window.rutaActivaDatos.id === idRuta) {
                        rutasCache[idRuta] = window.rutaActivaDatos;
                        window.rutaActivaDatos = undefined;
                        script.remove();
                        resolve(rutasCache[idRuta]);
                    } else {
                        script.remove();
                        reject(new Error(`Error de carga: Los datos de 'window.rutaActivaDatos' no coinciden con la ID ('${idRuta}').`));
                    }
                };
                script.onerror = () => {
                    script.remove();
                    reject(new Error(`Error de red: No se pudo localizar 'datos/rutas/${idRuta}.js'.`));
                };
                document.body.appendChild(script);
            });
        }

        async function seleccionarRuta(idRuta) {
            document.querySelectorAll('.carrusel-item').forEach(item => {
                item.classList.toggle('active', item.getAttribute('data-id-ruta') === idRuta);
            });

            const idPrevio = idRutaSeleccionada;
            idRutaSeleccionada = idRuta;

            try {
                const datos = await cargarDatosRuta(idRuta);

                if (idPrevio && idPrevio !== idRuta && rutasCache[idPrevio]) {
                    renderizarCapaRuta(idPrevio, false);
                }

                renderizarCapaRuta(idRuta, true);
                mostrarInfoRuta(datos);
            } catch (err) {
                console.error(err.message);
            }
        }

        function renderizarCapaRuta(idRuta, seleccionada) {
            const datos = rutasCache[idRuta];
            if (!datos) return;

            if (capasRutas[idRuta]) {
                capasPreview.removeLayer(capasRutas[idRuta]);
            }

            const colorTrazado = coloresEjes[datos.eje] || '#3498db';
            const estiloLinea = seleccionada
                ? { color: colorTrazado, weight: 6, opacity: 0.90 }
                : { color: colorTrazado, weight: 4, opacity: 0.30 };

            const grupoRuta = L.featureGroup();

            const capa = L.geoJSON(datos.geojson, {
                filter: function(feature) {
                    const props = feature.properties || {};
                    if (props.tipo === 'advertencia') {
                        return seleccionada;
                    }
                    return true;
                },
                style: function() {
                    return estiloLinea;
                },
                pointToLayer: function(feature, latlng) {
                    const props = feature.properties || {};
                    if (props.tipo === 'advertencia') {
                        return L.circleMarker(latlng, {
                            radius: 9,
                            fillColor: '#e74c3c',
                            color: '#ffffff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).bindPopup(`<strong>⚠️ ¡Atención!</strong><br>${props.descripcion}`);
                    }
                    if (props.icono) {
                        const iconoPersonalizado = L.divIcon({
                            className: 'marcador-punto-icono',
                            html: `<div class="marcador-punto-icono-interior">${props.icono}</div>`,
                            iconSize: [34, 34],
                            iconAnchor: [17, 17],
                            popupAnchor: [0, -17]
                        });
                        const marker = L.marker(latlng, { icon: iconoPersonalizado, opacity: seleccionada ? 1 : 0.45 });
                        if (props.titulo || props.descripcion) {
                            marker.bindPopup(`${props.titulo ? `<strong>${props.titulo}</strong><br>` : ''}${props.descripcion || ''}`);
                        }
                        return marker;
                    }
                    return L.marker(latlng, { opacity: seleccionada ? 1 : 0.45 });
                },
                onEachFeature: function(feature, layer) {
                    const tipoGeometria = feature.geometry && feature.geometry.type;
                    if (tipoGeometria === 'LineString' || tipoGeometria === 'MultiLineString') {
                        const zonaClick = L.polyline(layer.getLatLngs(), {
                            weight: 28,
                            opacity: 0,
                            interactive: true
                        });
                        zonaClick.on('click', () => seleccionarRuta(idRuta));
                        zonaClick.on('mouseover', () => layer.setStyle({ weight: estiloLinea.weight + 2 }));
                        zonaClick.on('mouseout', () => layer.setStyle(estiloLinea));
                        grupoRuta.addLayer(zonaClick);
                    }
                }
            });

            grupoRuta.addLayer(capa);
            capasRutas[idRuta] = grupoRuta;
            capasPreview.addLayer(grupoRuta);
        }

        function mostrarInfoRuta(datos) {
            const contenedor = document.getElementById('contenedor-tarjetas');
            contenedor.innerHTML = '';
            let claseDificultad = 'facil';
            let textoDificultad = 'Fácil';
            if (datos.dificultad === 'moderado') {
                claseDificultad = 'moderado';
                textoDificultad = 'Moderado';
            } else if (datos.dificultad === 'dificil') {
                claseDificultad = 'dificil';
                textoDificultad = 'Difícil';
            }
            const HTMLetiquetas = datos.etiquetas ? datos.etiquetas.map(t => `<span>#${t}</span>`).join('\n') : '';
            const HTMLconsejos = datos.consejos ? datos.consejos.map(c => `
                ${c.icono || '👉'} <strong>${c.titulo}:</strong> ${c.texto}.<br>
            `).join('\n') : '';

            const card = document.createElement('div');
            card.className = 'ruta-card';
            card.setAttribute('data-eje', datos.eje);
            card.innerHTML = `
                <div class="ruta-title" onclick="toggleMinimizar()">${datos.titulo}</div>
                <div class="ruta-subtitle">${datos.subtitulo}</div>
                <div class="ruta-meta">
                    <span class="tag-dificultad ${claseDificultad}">${textoDificultad}</span>
                    <span>📏 ${datos.distancia}</span>
                    <span>⏱️ ${datos.tiempo}</span>
                    <span>⬆️ ${datos.desnivel}</span>
                </div>
                <div class="ruta-meta">
                    ${HTMLetiquetas}
                </div>
                <p class="descripcion-ruta">${datos.descripcion}</p>
                <div class="indicaciones">
                    <strong>💡 Biciconsejos</strong><br><br>
                    ${HTMLconsejos}
                </div>
            `;
            contenedor.appendChild(card);

            const sidebar = document.getElementById('rutas-sidebar');
            if (esDispositivoMovil()) {
                sidebar.classList.remove('expanded', 'minimized');
                sidebar.classList.add('visible');
                sidebar.style.transform = 'translateY(55%)'; 
            } else {
                sidebar.classList.remove('minimized', 'expanded');
                sidebar.classList.add('visible');
                sidebar.style.transform = ''; 
            }
        }

        function cerrarSidebar() {
            const sidebar = document.getElementById('rutas-sidebar');
            sidebar.classList.remove('visible', 'expanded', 'minimized');
            if (esDispositivoMovil()) {
                sidebar.style.transform = 'translateY(100%)';
            } else {
                sidebar.style.transform = 'translateX(120%)';
            }
        }

        function toggleMinimizar() {
            const sidebar = document.getElementById('rutas-sidebar');
            if (sidebar.classList.contains('minimized')) {
                sidebar.classList.remove('minimized');
                if (esDispositivoMovil()) {
                    sidebar.classList.remove('expanded');
                    sidebar.style.transform = 'translateY(55%)';
                } else {
                    sidebar.style.transform = '';
                }
            } else {
                sidebar.classList.add('minimized');
                sidebar.classList.remove('expanded');
                if (esDispositivoMovil()) {
                    sidebar.style.transform = 'translateY(calc(100% - 75px))'; 
                }
            }
        }

        // GESTIÓN TÁCTIL SIDEBAR
        const sidebar = document.getElementById('rutas-sidebar');
        let startY = 0, currentY = 0, isDragging = false;
        let modoArrastre = null;
        function esDispositivoMovil() { return window.innerWidth <= 768; }

        sidebar.addEventListener('touchstart', (e) => {
            if (!esDispositivoMovil()) return;
            const enCabecera = e.target.id === 'drag-handle' || !!e.target.closest('.sidebar-header');
            startY = e.touches[0].clientY;
            currentY = startY;
            if (enCabecera || !sidebar.classList.contains('expanded')) {
                isDragging = true;
                modoArrastre = 'panel';
                sidebar.style.transition = 'none';
            } else {
                isDragging = false;
                modoArrastre = null;
            }
        });

        sidebar.addEventListener('touchmove', (e) => {
            if (!esDispositivoMovil()) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            if (modoArrastre === null) {
                const contenedorTarjetas = document.getElementById('contenedor-tarjetas');
                if (deltaY > 0 && contenedorTarjetas.scrollTop <= 0) {
                    isDragging = true;
                    modoArrastre = 'panel';
                    sidebar.style.transition = 'none';
                } else {
                    return;
                }
            }
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();
            if (sidebar.classList.contains('expanded')) {
                sidebar.style.transform = `translateY(${Math.max(0, deltaY)}px)`;
            } else if (sidebar.classList.contains('minimized')) {
                sidebar.style.transform = `translateY(calc(100% - 75px + ${deltaY}px))`;
            } else {
                sidebar.style.transform = `translateY(calc(55% + ${deltaY}px))`;
            }
        }, { passive: false });

        sidebar.addEventListener('touchend', () => {
            modoArrastre = null;
            if (!isDragging) return;
            isDragging = false;
            sidebar.style.transition = 'transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94)';
            
            const deltaY = currentY - startY;
            if (Math.abs(deltaY) > 70) {
                if (deltaY < 0) {
                    if (sidebar.classList.contains('minimized')) {
                        sidebar.classList.remove('minimized');
                        sidebar.style.transform = 'translateY(55%)';
                    } else {
                        sidebar.classList.add('expanded');
                        sidebar.style.transform = 'translateY(0%)';
                    }
                } else {
                    if (sidebar.classList.contains('expanded')) {
                        sidebar.classList.remove('expanded');
                        sidebar.style.transform = 'translateY(55%)';
                    } else {
                        sidebar.classList.add('minimized');
                        sidebar.style.transform = 'translateY(calc(100% - 75px))';
                    }
                }
            } else {
                if (sidebar.classList.contains('expanded')) {
                    sidebar.style.transform = 'translateY(0%)';
                } else if (sidebar.classList.contains('minimized')) {
                    sidebar.style.transform = 'translateY(calc(100% - 75px))';
                } else {
                    sidebar.style.transform = 'translateY(55%)';
                }
            }
        });

        const selectorEjes = document.getElementById('selector-ejes');
        function actualizarPistaScrollCarrusel() {
            const alFinal = selectorEjes.scrollLeft + selectorEjes.clientWidth >= selectorEjes.scrollWidth - 5;
            selectorEjes.classList.toggle('scroll-fin', alFinal);
        }
        selectorEjes.addEventListener('scroll', actualizarPistaScrollCarrusel);
        window.addEventListener('resize', actualizarPistaScrollCarrusel);
        window.addEventListener('load', actualizarPistaScrollCarrusel);
        window.addEventListener('resize', () => map.invalidateSize());
    </script>
</body>
</html>
