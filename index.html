<head>

    <!-- Open Graph -->
    <meta property="og:title" content="Mapa de carriles bici y Sítycleta en Las Palmas de Gran Canaria">

    <!-- Datos estructurados -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-light: #f8f9fa;
            --text-dark: #2c3e50;
            --border-color: #e2e8f0;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        /* Estilos Modo Oscuro de la Interfaz */
        body.dark-theme {
            --primary-color: #1a252f;
            --accent-color: #2980b9;
            --bg-light: #121212;
            --text-dark: #ecf0f1;
            --border-color: #2c3e50;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            height: 100%;
            width: 100%;
            position: fixed;
            inset: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-light);
            transition: background-color 0.3s ease;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        /* Navegación superior */
        nav {
            background: #2c3e50;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 2000;
            transition: background 0.3s ease;
        }
        body.dark-theme nav {
            background: #111a22;
        }
        nav a { color: #bdc3c7; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
        nav a:hover, nav a.active { color: #fff; border-bottom: 2px solid #2ecc71; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #fff; text-decoration: none; }
        .nav-slogan { color: #bdc3c7; font-size: 0.85rem; font-weight: 400; border-left: 1px solid #34495e; padding-left: 15px; }
        /* Grupo de enlaces de la derecha: envuelve y centra en vez de desbordar como texto suelto */
        .nav-links { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 20px; }
        /* Contenedor del Mapa */
        #app-container {
            display: flex;
            width: 100%;
            flex: 1;
            min-height: 0;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Iconos Emoji */
        .clean-emoji-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            line-height: 1;
            filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.4));
            transition: transform 0.15s ease;
        }
        .clean-emoji-marker:hover {
            transform: scale(1.25);
        }
        .emoji-sity { font-size: 22px; }
        .emoji-esity { font-size: 22px; }
        .emoji-vacia { font-size: 18px; }
        /* Control de capas personalizado */
        .custom-layer-control {
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            color: var(--text-dark);
            font-size: 0.85rem;
            max-width: 260px;
            user-select: none;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body.dark-theme .custom-layer-control {
            background: #1e2a38;
        }
        /* Botón toggle para minimizar en móvil */
        .layer-control-toggle {
            display: none;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: bold;
            text-align: left;
            padding: 2px 0;
            cursor: pointer;
            justify-content: space-between;
            align-items: center;
        }
        .base-map-selector {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .base-map-selector select {
            width: 100%;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-dark);
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }
        body.dark-theme .base-map-selector select {
            background: #2c3e50;
            color: #fff;
            border-color: #34495e;
        }
        .layer-group { margin-bottom: 10px; }
        .layer-group:last-child { margin-bottom: 0; }
        .layer-group-header {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 6px;
            cursor: pointer;
        }
        .layer-subitems {
            padding-left: 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .layer-item input, .layer-group-header input {
            cursor: pointer;
            accent-color: var(--accent-color);
        }
        .line-sample {
            display: inline-block;
            width: 16px;
            height: 4px;
            border-radius: 2px;
        }
        /* Botón flotante de geolocalización */
        .geoloc-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
        }
        body.dark-theme .geoloc-btn {
            background: rgba(30, 42, 56, 0.95);
            color: #ecf0f1;
        }
        .geoloc-btn:hover { background: rgba(0, 0, 0, 0.05); }
        .geoloc-btn.activo { background: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .geoloc-btn.buscando { animation: geolocPulso 1s ease-in-out infinite; }
        @keyframes geolocPulso {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* Ubicación del usuario */
        .marcador-ubicacion-usuario-wrap { position: relative; width: 18px; height: 18px; }
        .marcador-ubicacion-usuario-dot {
            position: absolute;
            inset: 0;
            background: #4285F4;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.35);
        }
        .marcador-ubicacion-usuario-pulso {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            background: rgba(66, 133, 244, 0.35);
            border-radius: 50%;
            animation: pulsoUbicacion 1.8s ease-out infinite;
        }
        @keyframes pulsoUbicacion {
            0% { transform: scale(1); opacity: 0.65; }
            100% { transform: scale(3); opacity: 0; }
        }
        /* Comportamiento Móvil */
        @media (max-width: 768px) {
            .nav-slogan { display: none; }
            nav a { font-size: 0.9rem; }
            .geoloc-btn { bottom: 20px; right: 16px; width: 46px; height: 46px; font-size: 1.25rem; }
            
            .custom-layer-control {
                font-size: 0.8rem;
                max-width: 210px;
                padding: 10px 12px;
            }
            .layer-control-toggle {
                display: flex;
            }
            .custom-layer-control.collapsed .layer-control-content {
                display: none;
            }
            .custom-layer-control.collapsed {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" class="logo">🚲 BiciLPA</a>
            <h1 class="nav-slogan">
                Mapa, rutas y servicios para moverte en bici por Las Palmas de Gran Canaria
            </h1>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Mapa en Vivo</a>
            <a href="rutas.html">Rutas Recomendadas</a>
            <a href="normativa.html">Normativa</a>
            <a href="talleres.html">Talleres</a>
        </div>
    </nav>
    <div id="app-container">
        <div id="map"></div>
        <button class="geoloc-btn" id="btn-geoloc" onclick="alternarGeolocalizacion()" title="Ver mi ubicación en el mapa" aria-label="Ver mi ubicación en el mapa">📍</button>
    </div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Datos estáticos de infraestructura -->
    <script src="datos/carriles-bici.js"></script>
    <script src="datos/aceras-bici.js"></script>
    <script src="datos/ciclovias.js"></script>
    <script>
        // ==========================================
        // 1. CONSTANTES Y CAPAS BASE DE MAPAS
        // ==========================================
        const URL_INFO = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_el/es/station_information.json';
        const URL_STATUS = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_el/es/station_status.json';
        const URL_TYPES = 'https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_el/es/vehicle_types.json';
        // CartoDB Voyager (Claro - Por defecto)
        const mapaClaro = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });
        // CartoDB Dark Matter (Oscuro)
        const mapaOscuro = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });
        // Google Maps Híbrido (Satélite + Callejero)
        const mapaSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            attribution: '&copy; Google Maps',
            maxZoom: 20
        });
        const map = L.map('map', {
            center: [28.128, -15.432],
            zoom: 14,
            layers: [mapaClaro]
        });
        // ==========================================
        // 2. CAPAS DE DATOS
        // ==========================================
        const sityMecanicasLayer = L.layerGroup().addTo(map);
        const sityElectricasLayer = L.layerGroup().addTo(map);
        const sityVaciasLayer = L.layerGroup().addTo(map);
        
        const carrilesBiciLayer = L.layerGroup().addTo(map);
        const acerasBiciLayer = L.layerGroup().addTo(map);
        const cicloviasLayer = L.layerGroup().addTo(map);
        // ==========================================
        // 3. CONTROL DE CAPAS PERSONALIZADO
        // ==========================================
        const CustomLayerControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                const container = L.DomUtil.create('div', 'custom-layer-control collapsed');
                L.DomEvent.disableClickPropagation(container);
                
                container.innerHTML = `
                    <button class="layer-control-toggle" id="btn-toggle-layers" aria-label="Mostrar u ocultar opciones de mapa">
                        <span>⚙️ Capas</span>
                        <span id="toggle-icon">▼</span>
                    </button>
                    <div class="layer-control-content">
                        <div class="base-map-selector">
                            <label for="select-basemap" style="font-weight: bold;"></label>
                            <select id="select-basemap">
                                <option value="claro">🗺️ Mapa</option>
                                <option value="oscuro">🌙 Oscuro</option>
                                <option value="satelite">🛰️ Satélite</option>
                            </select>
                        </div>
                        <div class="layer-group">
                            <label class="layer-group-header">
                                <input type="checkbox" id="grp-sity" checked>
                                <span>🚲 Estaciones Sítycleta</span>
                            </label>
                            <div class="layer-subitems">
                                <label class="layer-item">
                                    <input type="checkbox" id="chk-sity" checked>
                                    <span>🚲 Sítycleta</span>
                                </label>
                                <label class="layer-item">
                                    <input type="checkbox" id="chk-esity" checked>
                                    <span>⚡ e-Sítycleta</span>
                                </label>
                                <label class="layer-item">
                                    <input type="checkbox" id="chk-vacia" checked>
                                    <span>❌ Estación vacía</span>
                                </label>
                            </div>
                        </div>
                        <div class="layer-group">
                            <label class="layer-group-header">
                                <input type="checkbox" id="grp-vias" checked>
                                <span>🛣️ Vías de la ciudad</span>
                            </label>
                            <div class="layer-subitems">
                                <label class="layer-item">
                                    <input type="checkbox" id="chk-carril" checked>
                                    <span class="line-sample" style="background:#a93226;"></span>
                                    <span>Carril-Bici</span>
                                </label>
                                <label class="layer-item">
                                    <input type="checkbox" id="chk-acera" checked>
                                    <span class="line-sample" style="background:#27ae60;"></span>
                                    <span>Acera-Bici</span>
                                </label>
                                <label class="layer-item">
                                    <input type="checkbox" id="chk-ciclovia" checked>
                                    <span class="line-sample" style="background:#FF4500;"></span>
                                    <span>Ciclocarril</span>
                                </label>
                            </div>
                        </div>
                    </div>
                `;
                return container;
            }
        });
        map.addControl(new CustomLayerControl());
        function cambiarMapaBase(tipo) {
            [mapaClaro, mapaOscuro, mapaSatelite].forEach(m => {
                if (map.hasLayer(m)) map.removeLayer(m);
            });
            if (tipo === 'oscuro') {
                document.body.classList.add('dark-theme');
                map.addLayer(mapaOscuro);
            } else if (tipo === 'satelite') {
                document.body.classList.remove('dark-theme');
                map.addLayer(mapaSatelite);
            } else {
                document.body.classList.remove('dark-theme');
                map.addLayer(mapaClaro);
            }
        }
        function vincularControles() {
            // 1. Obtención de referencias
            const btnToggle = document.getElementById('btn-toggle-layers');
            const layerControlContainer = document.querySelector('.custom-layer-control');
            const toggleIcon = document.getElementById('toggle-icon');
            const selectBasemap = document.getElementById('select-basemap');
            const grpSity = document.getElementById('grp-sity');
            const chkSity = document.getElementById('chk-sity');
            const chkEsity = document.getElementById('chk-esity');
            const chkVacia = document.getElementById('chk-vacia');
            const grpVias = document.getElementById('grp-vias');
            const chkCarril = document.getElementById('chk-carril');
            const chkAcera = document.getElementById('chk-acera');
            const chkCiclovia = document.getElementById('chk-ciclovia');
            function toggleLayer(layer, show) {
                if (show) { if (!map.hasLayer(layer)) map.addLayer(layer); }
                else { if (map.hasLayer(layer)) map.removeLayer(layer); }
            }
            // 2. Gestión de localStorage
            const guardarPreferencias = () => {
                const prefs = {
                    basemap: selectBasemap.value,
                    layers: {
                        sity: chkSity.checked,
                        esity: chkEsity.checked,
                        vacia: chkVacia.checked,
                        carril: chkCarril.checked,
                        acera: chkAcera.checked,
                        ciclovia: chkCiclovia.checked
                    }
                };
                localStorage.setItem('bicilpa_user_prefs', JSON.stringify(prefs));
            };
            const cargarPreferencias = () => {
                const saved = localStorage.getItem('bicilpa_user_prefs');
                if (!saved) {
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    return {
                        basemap: prefersDark ? 'oscuro' : 'claro',
                        layers: { sity: true, esity: true, vacia: true, carril: true, acera: true, ciclovia: true }
                    };
                }
                try {
                    return JSON.parse(saved);
                } catch (e) {
                    return {
                        basemap: 'claro',
                        layers: { sity: true, esity: true, vacia: true, carril: true, acera: true, ciclovia: true }
                    };
                }
            };
            // 3. Aplicar preferencias guardadas
            const prefs = cargarPreferencias();
            selectBasemap.value = prefs.basemap;
            cambiarMapaBase(prefs.basemap);
            chkSity.checked = prefs.layers.sity;
            chkEsity.checked = prefs.layers.esity;
            chkVacia.checked = prefs.layers.vacia;
            chkCarril.checked = prefs.layers.carril;
            chkAcera.checked = prefs.layers.acera;
            chkCiclovia.checked = prefs.layers.ciclovia;
            toggleLayer(sityMecanicasLayer, chkSity.checked);
            toggleLayer(sityElectricasLayer, chkEsity.checked);
            toggleLayer(sityVaciasLayer, chkVacia.checked);
            toggleLayer(carrilesBiciLayer, chkCarril.checked);
            toggleLayer(acerasBiciLayer, chkAcera.checked);
            toggleLayer(cicloviasLayer, chkCiclovia.checked);
            const actualizarGrupoSity = () => {
                grpSity.checked = chkSity.checked || chkEsity.checked || chkVacia.checked;
                grpSity.indeterminate = (chkSity.checked || chkEsity.checked || chkVacia.checked) &&
                                       !(chkSity.checked && chkEsity.checked && chkVacia.checked);
            };
            const actualizarGrupoVias = () => {
                grpVias.checked = chkCarril.checked || chkAcera.checked || chkCiclovia.checked;
                grpVias.indeterminate = (chkCarril.checked || chkAcera.checked || chkCiclovia.checked) &&
                                       !(chkCarril.checked && chkAcera.checked && chkCiclovia.checked);
            };
            actualizarGrupoSity();
            actualizarGrupoVias();
            // 4. Lógica de interactividad y auto-colapso
            btnToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                layerControlContainer.classList.toggle('collapsed');
                const estaColapsado = layerControlContainer.classList.contains('collapsed');
                toggleIcon.textContent = estaColapsado ? '▼' : '▲';
            });
            const cerrarLeyendaSiEstaAbierta = () => {
                if (window.innerWidth <= 768 && !layerControlContainer.classList.contains('collapsed')) {
                    layerControlContainer.classList.add('collapsed');
                    toggleIcon.textContent = '▼';
                }
            };
            map.on('movestart', cerrarLeyendaSiEstaAbierta);
            map.on('click', cerrarLeyendaSiEstaAbierta);
            document.addEventListener('pointerdown', (e) => {
                if (!layerControlContainer.contains(e.target)) {
                    cerrarLeyendaSiEstaAbierta();
                }
            });
            // 5. Escuchadores de eventos
            selectBasemap.addEventListener('change', (e) => {
                cambiarMapaBase(e.target.value);
                guardarPreferencias();
            });
            grpSity.addEventListener('change', (e) => {
                const val = e.target.checked;
                chkSity.checked = val;
                chkEsity.checked = val;
                chkVacia.checked = val;
                toggleLayer(sityMecanicasLayer, val);
                toggleLayer(sityElectricasLayer, val);
                toggleLayer(sityVaciasLayer, val);
                guardarPreferencias();
            });
            chkSity.addEventListener('change', (e) => { toggleLayer(sityMecanicasLayer, e.target.checked); actualizarGrupoSity(); guardarPreferencias(); });
            chkEsity.addEventListener('change', (e) => { toggleLayer(sityElectricasLayer, e.target.checked); actualizarGrupoSity(); guardarPreferencias(); });
            chkVacia.addEventListener('change', (e) => { toggleLayer(sityVaciasLayer, e.target.checked); actualizarGrupoSity(); guardarPreferencias(); });
            grpVias.addEventListener('change', (e) => {
                const val = e.target.checked;
                chkCarril.checked = val;
                chkAcera.checked = val;
                chkCiclovia.checked = val;
                toggleLayer(carrilesBiciLayer, val);
                toggleLayer(acerasBiciLayer, val);
                toggleLayer(cicloviasLayer, val);
                guardarPreferencias();
            });
            chkCarril.addEventListener('change', (e) => { toggleLayer(carrilesBiciLayer, e.target.checked); actualizarGrupoVias(); guardarPreferencias(); });
            chkAcera.addEventListener('change', (e) => { toggleLayer(acerasBiciLayer, e.target.checked); actualizarGrupoVias(); guardarPreferencias(); });
            chkCiclovia.addEventListener('change', (e) => { toggleLayer(cicloviasLayer, e.target.checked); actualizarGrupoVias(); guardarPreferencias(); });
        }
        vincularControles();
        // ==========================================
        // 4. ICONOS EMOJI
        // ==========================================
        const crearIconoEmojiLimpio = (emoji, claseEmoji, size = 24) => L.divIcon({
            className: `clean-emoji-marker ${claseEmoji}`,
            html: emoji,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2],
            popupAnchor: [0, -(size / 2)]
        });
        const iconoSity = crearIconoEmojiLimpio('🚲', 'emoji-sity', 24);
        const iconoEsity = crearIconoEmojiLimpio('⚡', 'emoji-esity', 24);
        const iconoVacia = crearIconoEmojiLimpio('❌', 'emoji-vacia', 18);
        // ==========================================
        // 5. GEOLOCALIZACIÓN CONTINUA
        // ==========================================
        let siguiendoUbicacion = false;
        let esperandoPrimerFix = true;
        let marcadorUbicacion = null;
        let circuloPrecision = null;
        const iconoUbicacion = L.divIcon({
            className: 'marcador-ubicacion-usuario-wrap',
            html: '<div class="marcador-ubicacion-usuario-pulso"></div><div class="marcador-ubicacion-usuario-dot"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });
        function alternarGeolocalizacion() {
            if (siguiendoUbicacion) {
                detenerGeolocalizacion();
                return;
            }
            if (!navigator.geolocation) {
                alert('Tu navegador no admite geolocalización.');
                return;
            }
            siguiendoUbicacion = true;
            esperandoPrimerFix = true;
            document.getElementById('btn-geoloc').classList.add('buscando');
            map.locate({ watch: true, enableHighAccuracy: true, setView: false, maximumAge: 5000 });
        }
        function detenerGeolocalizacion() {
            siguiendoUbicacion = false;
            esperandoPrimerFix = true;
            map.stopLocate();
            const btn = document.getElementById('btn-geoloc');
            btn.classList.remove('activo', 'buscando');
            if (marcadorUbicacion) { map.removeLayer(marcadorUbicacion); marcadorUbicacion = null; }
            if (circuloPrecision) { map.removeLayer(circuloPrecision); circuloPrecision = null; }
        }
        map.on('locationfound', function (e) {
            const btn = document.getElementById('btn-geoloc');
            btn.classList.remove('buscando');
            btn.classList.add('activo');
            if (!marcadorUbicacion) {
                marcadorUbicacion = L.marker(e.latlng, { icon: iconoUbicacion, zIndexOffset: 1000, interactive: false }).addTo(map);
            } else {
                marcadorUbicacion.setLatLng(e.latlng);
            }
            if (!circuloPrecision) {
                circuloPrecision = L.circle(e.latlng, {
                    radius: e.accuracy, color: '#4285F4', weight: 1, fillColor: '#4285F4', fillOpacity: 0.08, interactive: false
                }).addTo(map);
            } else {
                circuloPrecision.setLatLng(e.latlng);
                circuloPrecision.setRadius(e.accuracy);
            }
            if (esperandoPrimerFix) {
                map.setView(e.latlng, Math.max(map.getZoom(), 15));
                esperandoPrimerFix = false;
            }
        });
        map.on('locationerror', function () {
            alert('No se pudo acceder a tu ubicación.');
            detenerGeolocalizacion();
        });
        // ==========================================
        // 6. CARGA DE INFRAESTRUCTURA GEOJSON
        // ==========================================
        function cargarInfraestructura() {
            if (typeof datosCarriles !== 'undefined') {
                L.geoJSON(datosCarriles, { style: { color: '#a93226', weight: 4, opacity: 0.9 } }).addTo(carrilesBiciLayer);
            }
            if (typeof datosAceras !== 'undefined') {
                L.geoJSON(datosAceras, { style: { color: '#27ae60', weight: 4, opacity: 0.85, dashArray: '5, 8' } }).addTo(acerasBiciLayer);
            }
            if (typeof datosCiclovias !== 'undefined') {
                L.geoJSON(datosCiclovias, { style: { color: '#FF4500', weight: 3, opacity: 0.8, dashArray: '3, 6' } }).addTo(cicloviasLayer);
            }
        }
        // ==========================================
        // 7. CONSULTA GBFS NEXTBIKE + ANTISOLAPAMIENTO
        // ==========================================
        async function actualizarSitycleta(){
            try {
                const [resInfo, resStatus, resTypes] = await Promise.all([
                    fetch(URL_INFO),
                    fetch(URL_STATUS),
                    fetch(URL_TYPES)
                ]);
                const infoData = await resInfo.json();
                const statusData = await resStatus.json();
                const typesData = await resTypes.json();
                const infoIndex = {};
                infoData.data.stations.forEach(station => { infoIndex[station.station_id] = station; });
                const metaTypesIndex = {};
                typesData.data.vehicle_types.forEach(type => {
                    metaTypesIndex[type.vehicle_type_id] = type.propulsion_type;
                });
                sityMecanicasLayer.clearLayers();
                sityElectricasLayer.clearLayers();
                sityVaciasLayer.clearLayers();
                statusData.data.stations.forEach(status => {
                    const info = infoIndex[status.station_id];
                    if (!info) return;
                    let mecanicas = 0;
                    let electricas = 0;
                    (status.vehicle_types_available || []).forEach(vehicle => {
                        const propulsion = metaTypesIndex[vehicle.vehicle_type_id];
                        if (propulsion === "human") mecanicas += vehicle.count;
                        if (propulsion === "electric_assist") electricas += vehicle.count;
                    });
                    const huecos = status.num_docks_available ?? 0;
                    if (mecanicas === 0 && electricas === 0) {
                        L.marker([info.lat, info.lon], { icon: iconoVacia })
                            .bindPopup(`<strong>${info.name}</strong><hr style="margin:5px 0; border:0; border-top:1px solid #eee;">❌ Sin bicicletas disponibles`)
                            .addTo(sityVaciasLayer);
                        return;
                    }
                    const haySolapamiento = mecanicas > 0 && electricas > 0;
                    const offsetLonMecanica = haySolapamiento ? -0.00008 : 0;
                    const offsetLonElectrica = haySolapamiento ? 0.00008 : 0;
                    if (mecanicas > 0) {
                        L.marker([info.lat, info.lon + offsetLonMecanica], { icon: iconoSity })
                            .bindPopup(`
                                <strong>🚲 ${info.name} (Mecánica)</strong>
                                <hr style="margin:5px 0; border:0; border-top:1px solid #eee;">
                                Bicicletas mecánicas: <b>${mecanicas}</b><br>
                                Anclajes libres: <b>${huecos}</b>
                            `)
                            .addTo(sityMecanicasLayer);
                    }
                    if (electricas > 0) {
                        L.marker([info.lat, info.lon + offsetLonElectrica], { icon: iconoEsity })
                            .bindPopup(`
                                <strong>⚡ ${info.name} (Eléctrica)</strong>
                                <hr style="margin:5px 0; border:0; border-top:1px solid #eee;">
                                Bicicletas eléctricas: <b>${electricas}</b><br>
                                Anclajes libres: <b>${huecos}</b>
                            `)
                            .addTo(sityElectricasLayer);
                    }
                });
            } catch (error) {
                console.error("Error al actualizar la API de Sítycleta:", error);
            }
        }
        // ==========================================
        // 8. INICIALIZACIÓN
        // ==========================================
        cargarInfraestructura();
        actualizarSitycleta();
        setInterval(actualizarSitycleta, 60000);
        window.addEventListener('resize', () => map.invalidateSize());
    </script>
</body>
</html>
