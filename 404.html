<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | BiciLPA</title>
    <meta name="description" content="La página que buscas no existe o se ha movido. Vuelve al inicio de BiciLPA para consultar rutas en bicicleta por Las Palmas de Gran Canaria.">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://hchafla.github.io/BiciLPA/404.html">

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-light: #f8f9fa;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        html, body {
            height: 100%;
            background-color: var(--bg-light);
        }
        body {
            display: flex;
            flex-direction: column;
        }
        nav {
            background: #2c3e50;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            flex-wrap: wrap;
            gap: 8px;
        }
        nav a { color: #bdc3c7; text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 0.95rem; }
        nav a:hover { color: #fff; border-bottom: 2px solid #2ecc71; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #fff; text-decoration: none; }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        .error-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 50px 40px;
            max-width: 480px;
        }
        .error-emoji {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        .error-code {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-volver {
            display: inline-block;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .btn-volver:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .enlaces-extra {
            margin-top: 20px;
            font-size: 0.85rem;
        }
        .enlaces-extra a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 8px;
        }
        .enlaces-extra a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">🚲 BiciLPA</a>
        <div>
            <a href="index.html">Mapa en Vivo</a>
            <a href="rutas.html">Rutas Recomendadas</a>
            <a href="normativa.html">Normativa</a>
            <a href="talleres.html">Talleres</a>
        </div>
    </nav>

    <main>
        <div class="error-card">
            <div class="error-emoji">🚲💨</div>
            <div class="error-code">ERROR 404</div>
            <h1>Esta ruta no existe</h1>
            <p>Parece que te has desviado del camino. La página que buscas no está aquí, puede que se haya movido o que la dirección tenga un error.</p>
            <a href="index.html" class="btn-volver">Volver al mapa en vivo</a>
            <div class="enlaces-extra">
                <a href="rutas.html">Ver rutas</a> ·
                <a href="normativa.html">Normativa</a> ·
                <a href="talleres.html">Talleres</a> ·
                <a href="contacto.html">Contacto</a>
            </div>
        </div>
    </main>
</body>
</html>
